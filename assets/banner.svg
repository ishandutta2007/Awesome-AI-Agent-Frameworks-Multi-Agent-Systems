<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0d1124"/><stop offset="100%" stop-color="#05070e"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366F1"/><stop offset="50%" stop-color="#A855F7"/><stop offset="100%" stop-color="#EC4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lightGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes float1{0%{transform:translate(0,0)}}@keyframes float2{0%{transform:translate(0,0)}}@keyframes float3{0%{transform:translate(0,0)}}@keyframes pulseSlow{0%{opacity:.25;transform:scale(.95)}}@keyframes pulseFast{0%{opacity:.3;transform:scale(1)}}@keyframes glowCycle{0%{filter:drop-shadow(0 0 10px rgba(99,102,241,.4))}}.pulse-slow{animation:pulseSlow 6s ease-in-out infinite alternate}.pulse-fast{animation:pulseFast 4s ease-in-out infinite alternate}.node-float-1{animation:float1 5s ease-in-out infinite alternate}.node-float-2{animation:float2 6s ease-in-out infinite alternate}.node-float-3{animation:float3 7s ease-in-out infinite alternate}.flow-pulse{stroke-dasharray:8,8;animation:dash 20s linear infinite}.pulse-glow{animation:glowCycle 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="180" cy="100" r="140" fill="#6366F1" class="pulse-slow" filter="url(#glow)" opacity=".3"/><circle cx="1020" cy="300" r="160" fill="#EC4899" class="pulse-fast" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="210" r="220" fill="#3B82F6" filter="url(#glow)" opacity=".12"/><g class="flow-pulse" opacity=".35"><line x1="120" x2="280" y1="90" y2="180" stroke="#818CF8" stroke-width="2"/><line x1="280" x2="160" y1="180" y2="330" stroke="#818CF8" stroke-width="2"/><line x1="280" x2="450" y1="180" y2="80" stroke="#C084FC" stroke-width="2"/><line x1="750" x2="920" y1="340" y2="240" stroke="#C084FC" stroke-width="2"/><line x1="920" x2="1080" y1="240" y2="320" stroke="#F472B6" stroke-width="2"/><line x1="920" x2="1050" y1="240" y2="110" stroke="#F472B6" stroke-width="2"/></g><g class="node-float-1"><circle cx="120" cy="90" r="6" fill="#6366F1" filter="url(#lightGlow)"/><circle cx="1080" cy="320" r="6" fill="#EC4899" filter="url(#lightGlow)"/></g><g class="node-float-2"><circle cx="280" cy="180" r="9" fill="#818CF8" filter="url(#lightGlow)"/><circle cx="920" cy="240" r="9" fill="#C084FC" filter="url(#lightGlow)"/><circle cx="1050" cy="110" r="5" fill="#38BDF8" filter="url(#lightGlow)"/></g><g class="node-float-3"><circle cx="160" cy="330" r="7" fill="#A855F7" filter="url(#lightGlow)"/><circle cx="450" cy="80" r="6" fill="#38BDF8" filter="url(#lightGlow)"/><circle cx="750" cy="340" r="7" fill="#F43F5E" filter="url(#lightGlow)"/></g><g transform="translate(600, 75)"><rect width="360" height="36" x="-180" y="-18" fill="#1E1B4B" stroke="#6366F1" stroke-opacity=".8" stroke-width="1.5" rx="18"/><circle cx="-150" cy="0" r="5" fill="#10B981" filter="url(#lightGlow)"/><text x="-135" y="5" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13"